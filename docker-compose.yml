services:

  # ─── Messaging ────────────────────────────────────────────────────────────────

  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_KRAFT_CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: '1536m'

  kafka-init:
    image: bitnami/kafka:3.7
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka/topics.sh:/topics.sh
    command: ["bash", "/topics.sh"]
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  # ─── Databases ────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: '1536m'

  mongodb:
    image: mongo:7
    container_name: mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DB}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: '1536m'

  # ─── Webhook Service ──────────────────────────────────────────────────────────

  webhook-service-1:
    build:
      context: .
      dockerfile: services/webhook-service/Dockerfile
    container_name: webhook-service-1
    environment:
      - PORT=9999
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: '512m'

  webhook-service-2:
    build:
      context: .
      dockerfile: services/webhook-service/Dockerfile
    container_name: webhook-service-2
    environment:
      - PORT=9999
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: '512m'

  # ─── Storage Service ──────────────────────────────────────────────────────────

  storage-service-1:
    build:
      context: .
      dockerfile: services/storage-service/Dockerfile
    container_name: storage-service-1
    environment:
      - PORT=9998
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: '512m'

  storage-service-2:
    build:
      context: .
      dockerfile: services/storage-service/Dockerfile
    container_name: storage-service-2
    environment:
      - PORT=9998
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: '512m'

  # ─── Streaming Service ────────────────────────────────────────────────────────

  streaming-service-1:
    build:
      context: .
      dockerfile: services/streaming-service/Dockerfile
    container_name: streaming-service-1
    environment:
      - PORT=9997
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MONGO_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: '512m'

  streaming-service-2:
    build:
      context: .
      dockerfile: services/streaming-service/Dockerfile
    container_name: streaming-service-2
    environment:
      - PORT=9997
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MONGO_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: '512m'

  # ─── Load Balancer ────────────────────────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "9999:9999"
      - "9998:9998"
      - "9997:9997"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - webhook-service-1
      - webhook-service-2
      - storage-service-1
      - storage-service-2
      - streaming-service-1
      - streaming-service-2

  # ─── Monitoring Dashboard ────────────────────────────────────────────────────

  monitoring-dashboard:
    build:
      context: .
      dockerfile: services/monitoring-dashboard/Dockerfile
    container_name: monitoring-dashboard
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - NODE_ENV=production
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: '512m'

  # ─── Monitoring ───────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.59
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

# ─── Volumes ──────────────────────────────────────────────────────────────────

volumes:
  kafka_data:
  postgres_data:
  mongo_data:
  prometheus_data:
  grafana_data:
